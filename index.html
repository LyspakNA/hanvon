<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes"><title>Hanvon WebView Inspector v2</title><style>body{font-family:Arial,sans-serif;margin:0;padding:16px;background:#fff;color:#111;font-size:16px}h1{font-size:23px}h2{font-size:19px;margin-top:20px}button{font-size:17px;display:block;padding:14px;margin:9px 0;width:100%;background:#eee;border:2px solid #222;color:#111;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #777;background:#f6f6f6;padding:12px;font-size:13px;line-height:1.55}small{font-size:13px} .ok{font-weight:bold} textarea{width:100%;height:160px;box-sizing:border-box;font-size:13px}</style></head><body>
<h1>Hanvon WebView Inspector v2</h1><p>Проверяет окружение страницы и признаки Android JS Bridge. <b>Не вызывает найденные методы</b>, ничего не устанавливает и не отправляет данные на сервер.</p>
<button id="run" type="button">Запустить диагностику</button><button id="copy" type="button">Скопировать отчёт</button><button id="select" type="button">Показать текст для копирования</button><p id="status">Готов к проверке.</p>
<h2>Отчёт</h2><pre id="report">Нажмите «Запустить диагностику».</pre><textarea id="txt" style="display:none" readonly></textarea>
<script>
(function(){
'use strict';
var report='';
function safe(fn){try{return fn()}catch(e){return 'ERROR: '+String(e&&e.message||e)}}
function feature(label, fn){return label+': '+safe(fn)}
function listOwnNames(obj){return safe(function(){return Object.getOwnPropertyNames(obj)})}
function diagnostic(){
 var lines=[];
 lines.push('HANVON WEBVIEW INSPECTOR V2');
 lines.push('Date: '+new Date().toISOString());
 lines.push('Page: '+location.protocol+'//'+location.host+location.pathname);
 lines.push('');
 lines.push('ENVIRONMENT');
 lines.push(feature('User-Agent',function(){return navigator.userAgent}));
 lines.push(feature('Platform',function(){return navigator.platform}));
 lines.push(feature('Language',function(){return navigator.language}));
 lines.push(feature('Languages',function(){return (navigator.languages||[]).join(', ')}));
 lines.push(feature('Viewport',function(){return innerWidth+' x '+innerHeight}));
 lines.push(feature('Touch points',function(){return navigator.maxTouchPoints}));
 lines.push(feature('Android UA token',function(){var m=navigator.userAgent.match(/Android\s+([\d.]+)/i);return m?m[1]:'not found'}));
 lines.push(feature('WebView token',function(){var m=navigator.userAgent.match(/\bwv\b|; wv\)/i);return m?m[0]:'not found'}));
 lines.push('');
 lines.push('BROWSER CAPABILITIES');
 var caps=['fetch','Promise','WebAssembly','indexedDB','localStorage','sessionStorage','crypto','TextEncoder','URL','Blob','FileReader','showOpenFilePicker','open','postMessage','serviceWorker'];
 for(var i=0;i<caps.length;i++){(function(name){lines.push(feature(name,function(){return name==='serviceWorker'?('serviceWorker' in navigator):name in window}))})(caps[i])}
 lines.push(feature('window.top === window',function(){return top===window}));
 lines.push(feature('document.referrer',function(){return document.referrer||'(empty)'}));
 lines.push('');
 lines.push('POSSIBLE BRIDGE OBJECTS');
 var names=listOwnNames(window);
 if(typeof names==='string')lines.push(names);
 else{
  var patterns=/android|native|bridge|java|jsinterface|javascriptinterface|hanvon|reader|ebook|webkit|device|hostapp|appinterface|client/i;
  var suspects=[];
  for(var j=0;j<names.length;j++)if(patterns.test(names[j]))suspects.push(names[j]);
  if(!suspects.length)lines.push('No names matched heuristic patterns. This does NOT prove no bridge exists.');
  for(var k=0;k<suspects.length;k++){
   var n=suspects[k];
   var typ=safe(function(){return typeof window[n]});
   // Names and types only; avoid introspecting/calling native bridge methods.
   lines.push('- '+n+' ('+typ+')');
  }
  lines.push('Total window own properties: '+names.length);
 }
 lines.push('');
 lines.push('KNOWN BRIDGE NAMES (presence only)');
 var known=['Android','android','Native','native','JSBridge','WebViewJavascriptBridge','Hanvon','hanvon','App','app','webkit'];
 for(var q=0;q<known.length;q++){(function(n){lines.push(feature(n,function(){return Object.prototype.hasOwnProperty.call(window,n)?'present ('+typeof window[n]+')':'not exposed as own property'}))})(known[q])}
 lines.push('');
 lines.push('INTERPRETATION');
 lines.push('Found names are NOT evidence that they can open system settings. No native methods were invoked.');
 lines.push('Absent names do NOT exclude a bridge with an unusual name.');
 report=lines.join('\n');
 document.getElementById('report').textContent=report;
 document.getElementById('txt').value=report;
 document.getElementById('status').textContent='Диагностика завершена. Данные остаются на этой странице.';
 }
 document.getElementById('run').onclick=diagnostic;
 document.getElementById('copy').onclick=function(){
  if(!report){diagnostic()}
  var el=document.getElementById('txt');el.style.display='block';el.value=report;el.focus();el.select();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(report).then(function(){document.getElementById('status').textContent='Отчёт скопирован.'},function(){document.getElementById('status').textContent='Автокопирование недоступно. Выделите текст ниже вручную.'})}
  else document.getElementById('status').textContent='Выделенный отчёт можно скопировать вручную.';
 };
 document.getElementById('select').onclick=function(){if(!report)diagnostic();var el=document.getElementById('txt');el.style.display='block';el.value=report;el.focus();el.select();document.getElementById('status').textContent='Текст отчёта выделен.'};
 diagnostic();
})();
</script></body></html>
