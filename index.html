<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanvon APK File Probe</title><style>body{font-family:Arial,sans-serif;background:#fff;color:#111;max-width:680px;margin:20px auto;padding:14px;line-height:1.5}button,label{display:block;padding:12px;margin:12px 0;border:2px solid #333;background:#fff;color:#111;font-size:17px}input{font-size:15px;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:10px;border:1px solid #aaa}small{color:#444}</style></head><body><h2>Hanvon · APK File Probe</h2><p>Проверка доступа Lightning Browser к скачанному APK. Файлы никуда не отправляются.</p><label>1. Выбрать любой файл (в том числе APK)<input id="file" type="file" accept="*/*,.apk,application/vnd.android.package-archive"></label><button id="probe">2. Проверить браузерные возможности</button><button id="copy">Скопировать отчёт</button><pre id="report">Ожидание проверки…</pre><small>Выбор файла не запускает установку. Если Android не показывает APK, проверьте меню выбора типа файлов «Все файлы».</small><script>(function(){var r=document.getElementById('report');var lines=[];function add(s){lines.push(s);r.textContent=lines.join('\n')}add('User-Agent: '+navigator.userAgent);add('Протокол: '+location.protocol);document.getElementById('file').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f){add('Файл не выбран');return}add('Файл: '+f.name+' | size: '+f.size+' bytes | type: '+(f.type||'(не указан)'));add('APK: '+(/\.apk$/i.test(f.name)?'да':'нет'));});document.getElementById('probe').onclick=function(){add('showOpenFilePicker: '+(typeof window.showOpenFilePicker));add('showDirectoryPicker: '+(typeof window.showDirectoryPicker));add('FileReader: '+(typeof window.FileReader));add('URL.createObjectURL: '+(typeof URL.createObjectURL));add('navigator.share: '+(typeof navigator.share));add('navigator.canShare: '+(typeof navigator.canShare));add('secure context: '+String(window.isSecureContext));};document.getElementById('copy').onclick=function(){var t=r.textContent;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert('Отчёт скопирован')},function(){fallback(t)})}else fallback(t)};function fallback(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');alert('Попытка копирования выполнена')}catch(e){alert('Выделите отчёт вручную')}document.body.removeChild(a)}})();</script></body></html>
